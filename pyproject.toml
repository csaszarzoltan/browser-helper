[project]
name = "browser-helper"
version = "1.28.2"
description = "Remote Chrome control proxy with REST API + GUI dashboard"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "playwright>=1.40.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.5",
    "pytest-testmon>=1.4",
    "ruff>=0.4.0",
]
# MCP server (src/mcp_server/) — needed for `bh mcp` / `bh-mcp`.
# Pin <2: FastMCP lives in mcp.server.fastmcp which moved to a separate
# `fastmcp` package in mcp 2.x.
mcp = [
    "mcp>=1.24,<2",
]

[tool.pytest.ini_options]
markers = [
    "quick: fast unit tests (< 1s each) - run with 'pytest -m quick'",
    "integration: integration tests (may need external services) or real API keys (skipped by default)",
    "slow: slow tests (> 5s each) - skipped in quick suite",
]
addopts = "-n auto -q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[project.scripts]
bh = "browser_helper.__main__:bh"
bh-mcp = "mcp_server.cli:app"
browser-helper-mcp = "mcp_server.cli:app"
