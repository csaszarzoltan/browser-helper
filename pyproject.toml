[project]
name = "browser-helper"
version = "1.20.0"
description = "Remote Chrome control proxy with REST API + GUI dashboard"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "playwright>=1.40.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: mark tests that require real API keys (skipped by default)",
    "quick: fast unit tests with mocks",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
