# =============================================================================
# docker-compose.yml — Browser Helper Proxy
#
# The proxy runs in a single container and connects to a Chrome instance
# running on the **host** via CDP over WebSocket.
#
# Network modes:
#   host   — works on Linux; the container sees localhost as the host's
#            loopback, so `http://127.0.0.1:9557` reaches the host Chrome
#            directly.  This is the simplest setup.
#
#   bridge — the service connects to Chrome at 127.0.0.1:9557 (CHROME_AUTO_PORT),
#            so a container on the bridge network cannot reach a Chrome on the
#            host.  Use host networking on Linux, or run `python run.py` on
#            macOS and Windows.
# =============================================================================

services:
  browser-helper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: browser-helper
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Set API_TOKEN when the container is reachable from outside this machine.
      # - API_TOKEN=<a-long-random-secret>
    # network_mode: host       # uncomment for Linux host-Chrome access
    restart: unless-stopped
